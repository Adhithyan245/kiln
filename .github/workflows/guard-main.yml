name: guard-main
# Stand-in for the lock-main ruleset until GitHub Pro is active (rulesets need Pro on private repos).
# A push to main by anyone except the admin is moved to a rescued/ branch and main is reset.
# Set the repo variable MAIN_PUSHER to change who may push to main (default: Adhithyan245).
on:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: guard-main
  cancel-in-progress: false
jobs:
  guard:
    if: github.actor != (vars.MAIN_PUSHER || 'Adhithyan245')
    runs-on: ubuntu-latest
    steps:
      - name: Move the push off main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          DELETED: ${{ github.event.deleted }}
        run: |
          zero=0000000000000000000000000000000000000000
          if [ "$DELETED" = "true" ]; then
            gh api -X POST "repos/$REPO/git/refs" -f ref=refs/heads/main -f sha="$BEFORE" > /dev/null
            echo "::error::$ACTOR deleted main. It has been restored. Work on a feature branch and open a PR into dev."
            exit 1
          fi
          rescue="rescued/$ACTOR-${AFTER:0:7}"
          gh api -X POST "repos/$REPO/git/refs" -f ref="refs/heads/$rescue" -f sha="$AFTER" > /dev/null
          if [ "$BEFORE" != "$zero" ]; then
            gh api -X PATCH "repos/$REPO/git/refs/heads/main" -f sha="$BEFORE" -F force=true > /dev/null
          fi
          echo "::error::Direct pushes to main are not allowed. Your commits were moved to '$rescue' and main was reset. Open a PR from that branch into dev."
          exit 1
