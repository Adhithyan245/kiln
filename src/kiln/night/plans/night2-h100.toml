# Night 2 replication on the H100 (docs/plan-changes.md row 27). Same frozen commit, settings, model and
# items as the GB10 primary run (night2.toml), but every output has its own path, so the two never
# overwrite each other when results are combined:
#   runs-h100/                               condition runs (and runs-h100/_night/night2-h100/ state)
#   protocol/predictions-h100.manifest.json  manifest
#   protocol/posts-h100.jsonl                hash-post receipt
# It uses the second Gemini account: set GEMINI_API_KEY_2 and leave GEMINI_API_KEY unset (preflight checks).
# Its GPU tiers run on the NVIDIA ALCHEMI Toolkit (row 28): set KILN_TIER_SETTINGS=env/h100/tier_settings.json
# (backend "nvalchemi+ase": Toolkit batches, ASE finishes what they leave). Preflight refuses to start without it.
# The GB10 run is primary and is named before anything is graded; this one is reported in its own table.
#
#   python -m kiln.night run src/kiln/night/plans/night2-h100.toml --runs-dir runs-h100

name = "night2-h100"
labels_must_be_absent = true   # labels never go to either run machine
heartbeat_s = 1800
cap_check_s = 60
stop_grace_s = 300

[caps]
# Same as night2.toml: ~9.3 M tokens and ~$23 expected for 346 items x 4 conditions x 3 seeds.
max_tokens = 12000000
max_usd = 30.0
max_gpu_hours = 8.0

[retry]
base_s = 30
factor = 2
jitter = 0.25
max_delay_s = 900

[gate]
receipt = "protocol/posts-h100.jsonl"
manifest = "protocol/predictions-h100.manifest.json"

[[steps]]
name = "preflight"
# Imports, and the key split: llm_call tries GEMINI_API_KEY first, so it must be unset here for the
# replication to run on the second account. Then the Toolkit: the H100 tier settings must be selected and
# the ALCHEMI Toolkit must import, so a forgotten variable can't silently run plain ASE.
cmd = ["python", "-c", "import os, kiln.compute.client, kiln.scoring.score; assert not os.environ.get('GEMINI_API_KEY'), 'unset GEMINI_API_KEY: the H100 run uses the second account'; assert os.environ.get('GEMINI_API_KEY_2'), 'set GEMINI_API_KEY_2'; assert os.environ.get('KILN_TIER_SETTINGS') == 'env/h100/tier_settings.json', 'set KILN_TIER_SETTINGS=env/h100/tier_settings.json'; from kiln.compute.profile import load_tier_settings; from kiln.schemas import ComputeTier; assert load_tier_settings()[ComputeTier.bounded_relaxation]['backend'] == 'nvalchemi+ase'; import nvalchemi; print('imports ok; second Gemini account; ALCHEMI Toolkit backend')"]
timeout_s = 300
retries = 0

[[steps]]
name = "run_conditions"
cmd = ["python", "-m", "kiln.runners.conditions", "--split", "heldout", "--all-conditions", "--all-seeds",
       "--model", "gemini-3.8-flash", "--items-file", "${HOME}/kiln-items.jsonl",
       "--frozen", "protocol/frozen_settings.json", "--parallel", "12", "--runs-dir", "runs-h100"]
depends_on = ["preflight"]
env = ["GEMINI_API_KEY_2"]
timeout_s = 36000
retries = 2

[[steps]]
name = "finalize"
cmd = ["python", "-m", "kiln.runners.finalize", "--split", "heldout", "--items-file", "${HOME}/kiln-items.jsonl",
       "--runs-dir", "runs-h100"]
depends_on = ["run_conditions"]
timeout_s = 1800
retries = 1

[[steps]]
name = "manifest"
cmd = ["python", "-m", "kiln.night.prereg", "manifest", "--runs-dir", "runs-h100", "--out",
       "protocol/predictions-h100.manifest.json"]
depends_on = ["finalize"]
timeout_s = 600
retries = 1

[[steps]]
name = "post_hash"
cmd = ["python", "-m", "kiln.night.prereg", "post", "--manifest", "protocol/predictions-h100.manifest.json",
       "--receipt", "protocol/posts-h100.jsonl"]
depends_on = ["manifest"]
env = ["KILN_PREREG_WEBHOOK"]
timeout_s = 300
retries = 4

[[steps]]
name = "push"
cmd = ["python", "-m", "kiln.night.gitpush", "--paths", "runs-h100", "protocol", "--message",
       "night2-h100: replication predictions and receipt", "--allow-no-remote"]
depends_on = ["post_hash"]
timeout_s = 600
retries = 3

[[steps]]
name = "fetch_labels"
cmd = ["python", "-m", "kiln.night.notready", "fetch_labels", "label source and receipt check (OPEN-16)", "Hemanath"]
depends_on = ["push"]
requires_receipt = true
timeout_s = 600
retries = 0
on_fail = "stop"

[[steps]]
name = "stop_brev"
cmd = ["brev", "stop", "${BREV_INSTANCE}"]
env = ["BREV_INSTANCE"]
on_missing_env = "skip"
always = true
timeout_s = 300
retries = 2
note = "Skipped with a note when the H100 is not a Brev instance."
