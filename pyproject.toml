[project]
name = "kiln"
version = "0.1.0"
description = "Auditable, budget-aware triage for solid-state reactions"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.7",
    "filelock>=3.13",
    "pymatgen>=2024.1",
    "ase>=3.23",
    "numpy>=1.26",
    "mp-api>=0.41",
    "google-genai>=1.0",
    "anthropic>=0.40",
    "openai>=1.50",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kiln"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
